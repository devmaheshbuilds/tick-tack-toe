<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tick Tac Toe</title>
    <link rel="stylesheet" href="tik.css">
</head>
<body>
    <main>
        <div class="msgcontainer hide">
            <p id="msg">Winner</p>
            <button id="New-game">New Game</button>
        </div>
    <h1>Tick Tac Toe</h1>
    <div class="container">
    <div class="game">
    <button id="zero" class="box"></button>
    <button id="one" class="box"></button>
    <button id="two" class="box"></button>
    <button id="three" class="box"></button>
    <button id="four" class="box"></button>
    <button id="five" class="box"></button>
    <button id="six" class="box"></button>
    <button id="seven" class="box"></button>
    <button id="eight" class="box"></button>
    </div>
    </div>
    <button id="reset">Reset Game</button>
    </main>
    <script src="tak.js"></script>
</body>
</html>
